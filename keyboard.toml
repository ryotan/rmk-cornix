[behavior]
one_shot = { timeout = "5s" }

[behavior.combo]
timeout = "50ms"

[behavior.morse]
# Default profile = the Vial QMK Settings of the snapshot
enable_flow_tap = true
prior_idle_time = "100ms"
permissive_hold = true
unilateral_tap = true
hold_timeout = "250ms"
gap_timeout = "250ms"
morses = [
  # TD(0) <- Vial TD0, tapping term 250
  { tap = "WM(Space, LCtrl | LShift | LAlt)", hold = "WM(No, LCtrl | LShift | LAlt)" },
  # TD(1) <- Vial TD1, tapping term 250
  { tap = "Language2", hold = "MO(3)", double_tap = "Language2", hold_after_tap = "MO(4)", profile = "THUMB" },
  # TD(2) <- Vial TD2, tapping term 250
  { tap = "Language1", hold = "MO(3)", double_tap = "Language1", hold_after_tap = "MO(4)", profile = "THUMB" },
  # TD(3) <- Vial TD31, tapping term 250
  { tap = "WM(Kc0, LGui)", hold = "TG(8)", double_tap = "OSL(9)" },
]

[behavior.morse.profiles]
# Thumb keys: Flow Tap off, so a letter followed quickly by a thumb key still enters the layer
THUMB = { enable_flow_tap = false, permissive_hold = true, unilateral_tap = true, hold_timeout = "250ms", gap_timeout = "250ms" }
# Modifier-only keys (MT with an empty tap): hold decided by time alone after 20 ms
MODKEY = { enable_flow_tap = false, normal_mode = true, unilateral_tap = false, hold_timeout = "20ms", gap_timeout = "20ms" }

