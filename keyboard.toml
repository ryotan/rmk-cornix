[keyboard]
name = "Cornix"
product_name = "Cornix"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Jezail Funder"
chip = "nrf52840"

[ble]
enabled = true
use_2m_phy = true
default_tx_power = 0
battery_adc_pin = "P0_05"
adc_divider_measured = 2000
adc_divider_total = 2806

[split]
connection = "ble"

[split.central]
rows = 4
cols = 7
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = ["P0_30", "P0_31", "P0_29", "P0_02"]
col_pins = ["P0_28", "P0_03", "P1_10", "P1_11", "P1_13", "P0_09", "P0_10"]

[[split.central.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
phase = "resolution"
resolution = 4
# Without the MCU pull-ups the encoder never registers a turn (verified 2026-09-13); the ZMK port pulls P1.04/P1.06 up as well
internal_pullup = true

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 4
col_offset = 0

[split.peripheral.matrix]
row_pins = ["P1_09", "P0_28", "P0_03", "P1_10"]
col_pins = ["P0_30", "P0_31", "P0_29", "P0_02", "P1_13", "P0_10", "P0_09"]

[[split.peripheral.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
phase = "resolution"
resolution = 4
# Without the MCU pull-ups the encoder never registers a turn (verified 2026-09-13); the ZMK port pulls P1.04/P1.06 up as well
internal_pullup = true

[rmk]
split_peripherals_num = 1
debounce_time = 5
# 3 profiles keep the User keycodes numbered like the official firmware:
# User0-2 = BT0-2, User3 = next, User4 = prev, User5 = clear bond, User6 = USB/BLE, User7 = clear split peer
ble_profiles_num = 3
morse_max_num = 32
max_patterns_per_key = 8
combo_max_num = 32
fork_max_num = 16

[host]
vial_enabled = true
unlock_keys = [[1, 3], [1, 4]]

[storage]
enabled = true
clear_storage = false
clear_layout = false

[dependency]
defmt_log = false

[chip.nrf52840]
dcdc_reg0 = true
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

