name: Build RMK firmware

# No path filter: the job is a required status check on main, and a filtered-out PR would never report it.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default-deny token permissions; the job only needs read access to clone the repository.
permissions:
  contents: read

# mise ignores `paranoid` in project configs (it is a global-only setting), so it is set through the
# environment here to re-verify attestations on every install.
env:
  MISE_PARANOID: "true"

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # A warm run takes about 2 minutes; 30 absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        # The allowlist was baselined from the audit-mode log of a run on main. GitHub's own domains
        # (github.com and *.github.com: the rmk fork, mise downloads) are allowed by the action.
        #   - apt (libclang): the Ubuntu, Microsoft and Google package sources configured on the runner
        #   - cargo and rustup: crates.io and static.rust-lang.org
        #   - mise: its version API and GitHub release assets, and Sigstore for the attestation checks
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            azure.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout needs the git token.
          persist-credentials: false

      # Installs what rust-toolchain.toml declares (channel, components, the thumbv7em target) and
      # caches the cargo registry and target directory. StepSecurity's maintained fork of
      # actions-rust-lang/setup-rust-toolchain is free for public repositories.
      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspace-crates: true

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      # nrf-sdc-sys runs bindgen over the SoftDevice controller headers.
      - name: Install libclang (nrf-sdc bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # The build tools come from .config/mise/config.toml, pinned in .config/mise/mise.lock: the same
      # versions as locally.
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.1

      - id: lint
        name: Format check and clippy
        run: mise run lint
        continue-on-error: true  # Run all checks, then fail at the end

      - id: test
        name: Test cornix-led on the host
        run: mise run test
        continue-on-error: true  # Run all checks, then fail at the end

      - id: build
        name: Build UF2 (firmware/rmk-cornix-central.uf2 / firmware/rmk-cornix-peripheral.uf2)
        run: mise run build
        continue-on-error: true  # Run all checks, then fail at the end

      - name: Upload uf2 artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmk-cornix-uf2
          path: |
            firmware/rmk-cornix-central.uf2
            firmware/rmk-cornix-peripheral.uf2

      - name: Upload elf artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmk-cornix-elf
          path: |
            target/thumbv7em-none-eabihf/release/central
            target/thumbv7em-none-eabihf/release/peripheral

      - name: Report results
        if: always()
        shell: bash
        env:
          RESULTS: |
            lint=${{ steps.lint.outcome }}
            test=${{ steps.test.outcome }}
            build=${{ steps.build.outcome }}
        run: |
          failed=0
          while IFS='=' read -r name outcome; do
            [ -z "$name" ] && continue
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name failed"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All steps succeeded."
