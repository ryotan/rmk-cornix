name: 'Scorecard'

on:
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny token permissions; the analysis job below grants the extra scopes it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: 'Scorecard analysis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Needed for the Code Scanning upload.
      id-token: write # Needed for the GitHub OIDC token used by publish_results.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # Audit mode first; switch to `egress-policy: block` with an endpoint allowlist after a few real runs.
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # This repository is public: publishing feeds the Scorecard public dataset
          # (https://github.com/ossf/scorecard#public-data) and enables the results badge.
          publish_results: true

      - name: 'Upload artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 'Upload to code-scanning'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
