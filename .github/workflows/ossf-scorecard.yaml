name: 'Scorecard'

on:
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny token permissions; the analysis job below grants the extra scopes it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: 'Scorecard analysis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Needed for the Code Scanning upload.
      id-token: write # Needed for the GitHub OIDC token used by publish_results.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # Audit mode first; switch to `egress-policy: block` with an endpoint allowlist after a few real runs.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # This repository is public: publishing feeds the Scorecard public dataset
          # (https://github.com/ossf/scorecard#public-data) and enables the results badge.
          publish_results: true

      - name: 'Upload artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 'Upload to code-scanning'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
