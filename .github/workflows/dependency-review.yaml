name: 'Dependency Review'

# Block PRs that introduce dependencies with a moderate-or-higher severity advisory. This repository is
# public, so `actions/dependency-review-action` is available without GitHub Advanced Security and it adds
# license-policy checks on top of the vulnerability scan.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny token permissions; the job grants what it needs.
permissions:
  contents: read

jobs:
  dependency-review:
    name: 'Dependency Review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # The action posts a summary comment on failure.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # The action reaches deps.dev and the Scorecard API when a PR changes dependencies. GitHub's own
        # domains are allowed by the action.
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.deps.dev:443
            api.securityscorecards.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
