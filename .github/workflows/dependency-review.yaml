name: 'Dependency Review'

# Block PRs that introduce dependencies with a moderate-or-higher severity advisory. This repository is
# public, so `actions/dependency-review-action` is available without GitHub Advanced Security and it adds
# license-policy checks on top of the vulnerability scan.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny token permissions; the job grants what it needs.
permissions:
  contents: read

jobs:
  dependency-review:
    name: 'Dependency Review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # The action posts a summary comment on failure.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # The action reaches deps.dev and the Scorecard API when a PR changes dependencies. GitHub's own
        # domains are allowed by the action.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.securityscorecards.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
