name: 'CodeQL'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 2 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the analysis job grants what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: 'CodeQL (rust)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads the analysis to code scanning.
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        # The allowlist was baselined from the audit-mode log of a PR run: the CodeQL bundle comes from
        # GitHub release assets, and the extractor resolves the crate graph through rustup and crates.io.
        # GitHub's own domains are allowed by the action.
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            index.crates.io:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none extracts the sources without building them, so neither the MCU target nor the
      # firmware build tools (mise, libclang) are needed here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust
