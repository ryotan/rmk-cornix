name: 'Workflow Lint'

# Check workflow definitions with zizmor, ghalint and pinact.
#
# The linters read only the workflows. The mise files are in the path filters because they define the linters.
on:
  push:
    branches:
      - main
    paths: &lint-paths
      - '.github/workflows/**'
      - '.config/mise/config.toml'
      - '.config/mise/config.ci-workflow-lint.toml'
      - '.config/mise/mise.lock'
  pull_request:
    branches:
      - main
    paths: *lint-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR branch are cancelled; runs on main are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; this workflow only reads the repository.
permissions:
  contents: read

jobs:
  workflow-lint:
    name: 'Workflow Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Selects tools by file rather than install_args, so the cache key can hash them.
      MISE_ENV: ci-workflow-lint
    steps:
      - name: Harden Runner
        # mise, the linters' release assets, and Sigstore for the attestation checks.
        # GitHub's own domains (pinact's API calls) are allowed by the action.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            mise.jdx.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache the files mise downloads, not the installed tools:
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - name: Cache mise download store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: >-
            mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_ENV }}-${{
            hashFiles('.config/mise/config*.toml', '.config/mise/mise*.lock') }}

      - name: Install the linters
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          # mise ignores `paranoid` in project configs (it is a global-only setting), so CI asks for it
          # with this variable.
          MISE_PARANOID: 'true'
        with:
          version: 2026.10.10
          cache: false

      - name: ghalint
        id: ghalint
        run: ghalint run
        continue-on-error: true

      - name: zizmor
        id: zizmor
        # Include findings hidden by the default persona.
        run: zizmor --persona=auditor .github/workflows/
        continue-on-error: true

      - name: pinact
        id: pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check .github/workflows/*.yml .github/workflows/*.yaml
        continue-on-error: true

      - name: Report results
        if: always()
        shell: bash
        env:
          RESULTS: |
            ghalint=${{ steps.ghalint.outcome }}
            zizmor=${{ steps.zizmor.outcome }}
            pinact=${{ steps.pinact.outcome }}
        run: |
          failed=0
          while IFS='=' read -r name outcome; do
            [ -z "$name" ] && continue
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name failed"
              failed=1
            fi
          done <<< "$RESULTS"
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All steps succeeded."
