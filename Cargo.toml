[package]
name = "rmk-cornix"
version = "0.1.0"
authors = ["adong660 <adong660@gmail.com>"]
description = "RMK firmware for Cornix"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]
members = ["led"]

[dependencies]
rmk = { version = "=0.9.0", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
] }
nrf-sdc = { version = "=0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "=0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "=0.11.0", features = ["defmt"] }

cortex-m = "=0.7.9"
cortex-m-rt = "=0.7.7"
embassy-time = { version = "=0.5.1", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "=0.11.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "=0.10.0", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
static_cell = "=2.1.1"
# Status LED logic; dependency-free so it is unit-tested on the host (`mise run test`).
cornix-led = { path = "led" }

[build-dependencies]
xz2 = "=0.1.7"
# `json` is unmaintained (RUSTSEC-2022-0081); serde_json is already in the build graph through rmk-config.
serde_json = "=1.0.152"
const-gen = "=1.6.10"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = false
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

# The fork provides modifier handling fixes and 1M PHY for the split link.
[patch.crates-io]
rmk = { git = "https://github.com/ryotan/rmk.git", rev = "3126b5457f12dfdaedd75de707dc8c07a73b87b6" }
