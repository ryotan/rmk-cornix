# The repo is a cargo workspace (the cornix-led crate is in led/). Run the tasks once at the root
# instead of once per member, which would look for them in led/ and fail.
[config]
default_to_workspace = false

[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

# cargo-make, cargo-binutils, cargo-hex-to-uf2 and flip-link come from mise (.config/mise/config.toml).
[tasks.build]
command = "cargo"
args = ["build", "--release", "--locked"]
dependencies = ["install-llvm-tools"]

[tasks.objcopy-central]
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "central",
    "--",
    "-O",
    "ihex",
    "target/rmk-cornix-central.hex",
]
dependencies = ["build"]

[tasks.objcopy-peripheral]
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "peripheral",
    "--",
    "-O",
    "ihex",
    "target/rmk-cornix-peripheral.hex",
]
dependencies = ["build"]

# flash.sh reads the UF2 images from firmware/. It is untracked (*.uf2 is ignored), so the build
# creates it.
[tasks.firmware-dir]
command = "mkdir"
args = ["-p", "firmware"]

[tasks.uf2-central]
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "target/rmk-cornix-central.hex",
    "--output-path",
    "firmware/rmk-cornix-central.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-central", "firmware-dir"]

[tasks.uf2-peripheral]
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "target/rmk-cornix-peripheral.hex",
    "--output-path",
    "firmware/rmk-cornix-peripheral.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-peripheral", "firmware-dir"]

[tasks.uf2]
dependencies = ["uf2-central", "uf2-peripheral"]
